###########################################################
#                Experiment Settings                      #
###########################################################
use_wandb: True

###########################################################
#                Loss Functions                           #
###########################################################
use_ctc_loss: false

###########################################################
#             DEFAULT OPTIMIZER & SCHEDULER SETTING       #
###########################################################
model_optimizer_type: Adam
model_optimizer_params:
    lr: 1.0e-6     ## 1.0e-4 
    betas: [0.9, 0.999] # [0.5, 0.9]  
    weight_decay: 1.0e-3  # 1.0e-3

model_scheduler_type: MultiStepLR
model_scheduler_params:
    gamma: 0.7  # 0.5
    milestones:
        # - 16000
        # - 24000
        # - 32000
        # - 40000
        # - 48000
        # - 56000
        # - 64000
        # - 72000
    #     - 300
    #     - 350
    #     - 400
    #     - 450
    #     - 500
    #     - 550
    #     - 600
    #     - 650
    #     - 700
    #     - 750
    #     - 800 
    # milestones:
    #     - 40000
    #     - 80000
    #     - 120000
    #     - 160000
# model_scheduler_type: ReduceLROnPlateau
# model_scheduler_params:
#     mode: 'min'
#     factor: 0.5
#     patience: 5
model_grad_norm: 1